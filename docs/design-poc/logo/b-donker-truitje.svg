<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Truitje Trek</title>
  <!-- Variant B "Donker truitje": het truitje zelf is een scorebordtegel (donker, groene lijn, geel cijfer)
       op het groene veld van de app. De rode mouw trekt eraan. -->
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d24"/>
      <stop offset="1" stop-color="#0f5132"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#pitch)"/>
    <!-- Maaistroken -->
    <g fill="#ffffff" opacity=".04">
      <rect x="0" y="0" width="512" height="64"/>
      <rect x="0" y="128" width="512" height="64"/>
      <rect x="0" y="256" width="512" height="64"/>
      <rect x="0" y="384" width="512" height="64"/>
    </g>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="8"/>

    <!-- Vaartstreepjes in scorebordgeel -->
    <g stroke="#fac775" stroke-width="14" stroke-linecap="round" opacity=".9">
      <line x1="48" y1="196" x2="92" y2="196"/>
      <line x1="32" y1="246" x2="96" y2="246"/>
      <line x1="48" y1="296" x2="92" y2="296"/>
    </g>

    <!-- Het truitje als tegel: donker met de dunne groene lijn -->
    <g transform="translate(-30 -6) rotate(-6 256 256)">
      <path d="M200 112
               Q256 136 312 112
               L388 146 L420 222 L362 244 L344 214
               L344 300
               Q392 336 448 352
               L438 396
               Q356 392 300 412
               Q244 404 186 412
               L190 214 L172 244 L114 222 L146 146 Z"
            fill="#06291b" stroke="#5dcaa5" stroke-width="12" stroke-linejoin="round"/>
      <path d="M220 120 Q256 166 292 120" fill="none" stroke="#5dcaa5" stroke-width="12" stroke-linecap="round"/>
      <!-- Spanningsplooien in de lijnkleur -->
      <g fill="none" stroke="#5dcaa5" stroke-opacity=".45" stroke-width="8" stroke-linecap="round">
        <path d="M262 300 Q340 340 418 372"/>
        <path d="M232 352 Q330 370 412 386"/>
        <path d="M300 250 Q350 296 410 350"/>
      </g>
      <!-- Rugnummer 7 in scorebordgeel -->
      <path transform="translate(186 214)" d="M0 0 H98 V24 L50 118 H16 L58 24 H0 Z" fill="#fac775"/>
    </g>

    <!-- De hand van de tegenstander (rode mouw) die het truitje vastgrijpt -->
    <path d="M432 404 L470 360 L580 450 L540 500 Z" fill="#d64545" stroke="#06291b" stroke-width="12" stroke-linejoin="round"/>
    <path d="M446 388 L468 362" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    <g transform="rotate(-40 418 366)">
      <rect x="366" y="328" width="108" height="76" rx="30" fill="#f2c39b" stroke="#06291b" stroke-width="12"/>
      <g stroke="#06291b" stroke-width="8" stroke-linecap="round">
        <line x1="394" y1="332" x2="394" y2="356"/>
        <line x1="420" y1="332" x2="420" y2="356"/>
        <line x1="446" y1="332" x2="446" y2="356"/>
      </g>
    </g>
  </g>
</svg>
