<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 100 210" preserveAspectRatio="xMidYMid slice">
  <!-- Live laag boven pitch.svg (zelfde viewBox): een aanval zoals op een tactiekbord. Drie spelers,
       twee passes en een schot op doel, daarna een rustpauze. Lus van 18 s; zie body::before in app.css. -->
  <defs>
    <mask id="pass1" maskUnits="userSpaceOnUse" x="0" y="-20" width="100" height="210">
      <path d="M30 120 Q52 112 68 92" fill="none" stroke="#fff" stroke-width="4" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" calcMode="spline"
                 keyTimes="0;.08;.16;.22;.30;.36;.41;1" values="1;1;0;0;0;0;0;0"
                 keySplines="0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1"/>
      </path>
    </mask>
    <mask id="pass2" maskUnits="userSpaceOnUse" x="0" y="-20" width="100" height="210">
      <path d="M68 92 Q60 66 40 52" fill="none" stroke="#fff" stroke-width="4" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" calcMode="spline"
                 keyTimes="0;.08;.16;.22;.30;.36;.41;1" values="1;1;1;1;0;0;0;0"
                 keySplines="0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1"/>
      </path>
    </mask>
    <mask id="shot" maskUnits="userSpaceOnUse" x="0" y="-20" width="100" height="210">
      <path d="M40 52 Q46 26 50 7" fill="none" stroke="#fff" stroke-width="4" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" calcMode="spline"
                 keyTimes="0;.08;.16;.22;.30;.36;.41;1" values="1;1;1;1;1;1;0;0"
                 keySplines="0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1"/>
      </path>
    </mask>
  </defs>

  <!-- Spelers en passlijnen: verschijnen samen en vervagen na het schot -->
  <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             keyTimes="0;.03;.07;.48;.56;1" values="0;0;1;1;0;0"/>
    <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width=".45">
      <circle cx="30" cy="120" r="2.2"/>
      <circle cx="68" cy="92" r="2.2"/>
      <circle cx="40" cy="52" r="2.2"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width=".5" stroke-dasharray="1.4 1.6" stroke-linecap="round">
      <path d="M30 120 Q52 112 68 92" mask="url(#pass1)"/>
      <path d="M68 92 Q60 66 40 52" mask="url(#pass2)"/>
      <path d="M40 52 Q46 26 50 7" mask="url(#shot)"/>
    </g>
  </g>

  <!-- Golfje in het doel na het schot -->
  <circle cx="50" cy="7" r="0" fill="none" stroke="#fff" stroke-width=".5" opacity="0">
    <animate attributeName="r" dur="18s" repeatCount="indefinite" keyTimes="0;.41;.49;1" values="0;0;6;6"/>
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;.405;.41;.49;1" values="0;0;.45;0;0"/>
  </circle>

  <!-- De bal: rolt de passes en het schot langs dezelfde lijnen -->
  <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             keyTimes="0;.04;.07;.41;.45;1" values="0;0;1;1;0;0"/>
    <g>
      <animateMotion dur="18s" repeatCount="indefinite" calcMode="spline"
                     path="M30 120 Q52 112 68 92 Q60 66 40 52 Q46 26 50 7"
                     keyTimes="0;.08;.16;.22;.30;.36;.41;1" keyPoints="0;0;.333;.333;.679;.679;1;1"
                     keySplines="0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1;.2 .6 .4 1;0 0 1 1"/>
      <circle r="1.25" fill="#fff" fill-opacity=".6"/>
      <circle r="1.25" fill="none" stroke="#0b3d24" stroke-opacity=".35" stroke-width=".25"/>
    </g>
  </g>
</svg>
