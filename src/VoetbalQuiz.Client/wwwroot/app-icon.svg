<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-icoon (vierkant, zonder transparante hoeken): het OS legt er zelf een masker over (cirkel, squircle, ...).
       Daarom geen eigen tegelrand zoals in logo.svg; de groene lijn is hier de middencirkel. Alles staat binnen
       de veilige zone van 80% zodat niets wegvalt. -->
  <title>Truitje Trek</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#06291b"/>
    <!-- Maaistroken, nauwelijks zichtbaar (volledig tot in de hoeken) -->
    <g fill="#ffffff" opacity=".03">
      <rect x="0" y="0" width="512" height="64"/>
      <rect x="0" y="128" width="512" height="64"/>
      <rect x="0" y="256" width="512" height="64"/>
      <rect x="0" y="384" width="512" height="64"/>
    </g>

    <!-- Alles binnen de veilige zone: geschaald rond het midden -->
    <g transform="translate(256 256) scale(.76) translate(-256 -256)">
      <circle cx="256" cy="256" r="232" fill="none" stroke="#5dcaa5" stroke-opacity=".4" stroke-width="10"/>

      <g stroke="#5dcaa5" stroke-width="14" stroke-linecap="round" opacity=".85">
        <line x1="52" y1="196" x2="96" y2="196"/>
        <line x1="36" y1="246" x2="100" y2="246"/>
        <line x1="52" y1="296" x2="96" y2="296"/>
      </g>

      <g transform="translate(-30 -6) rotate(-6 256 256)">
        <path d="M200 112
                 Q256 136 312 112
                 L388 146 L420 222 L362 244 L344 214
                 L344 300
                 Q392 336 448 352
                 L438 396
                 Q356 392 300 412
                 Q244 404 186 412
                 L190 214 L172 244 L114 222 L146 146 Z"
              fill="#f5c400" stroke="#031a10" stroke-width="12" stroke-linejoin="round"/>
        <path d="M220 120 Q256 166 292 120" fill="none" stroke="#031a10" stroke-width="12" stroke-linecap="round"/>
        <g fill="none" stroke="#c99f00" stroke-width="8" stroke-linecap="round">
          <path d="M262 300 Q340 340 418 372"/>
          <path d="M232 352 Q330 370 412 386"/>
          <path d="M300 250 Q350 296 410 350"/>
        </g>
        <path transform="translate(186 214)" d="M0 0 H98 V24 L50 118 H16 L58 24 H0 Z" fill="#06291b"/>
      </g>

      <!-- Rode mouw loopt door tot buiten het icoon -->
      <path d="M432 404 L470 360 L700 548 L660 598 Z" fill="#d64545" stroke="#031a10" stroke-width="12" stroke-linejoin="round"/>
      <path d="M446 388 L468 362" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
      <g transform="rotate(-40 418 366)">
        <rect x="366" y="328" width="108" height="76" rx="30" fill="#f2c39b" stroke="#031a10" stroke-width="12"/>
        <g stroke="#031a10" stroke-width="8" stroke-linecap="round">
          <line x1="394" y1="332" x2="394" y2="356"/>
          <line x1="420" y1="332" x2="420" y2="356"/>
          <line x1="446" y1="332" x2="446" y2="356"/>
        </g>
      </g>
    </g>
  </g>
</svg>
