<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Truitje Trek – Voetbalquiz</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Kleuren-emoji (o.a. vlaggen, die Windows anders als letters toont) voor de emoji-raadsels -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Er ging iets mis.
        <a href="." class="reload">Herladen</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Kleine hulpjes voor Blazor (JS-interop).
        window.truitje = {
            shareCaps: () => ({ share: !!navigator.share, touch: matchMedia('(pointer: coarse)').matches }),
            share: async data => {
                try { await navigator.share(data); return 'ok'; }
                catch (e) { return e && e.name === 'AbortError' ? 'cancel' : 'error'; }
            },
            copy: async text => {
                try { await navigator.clipboard.writeText(text); return true; }
                catch { return false; }
            },
        };

        // Navigatie in de app: hoeveel schermen terug er nog binnen de app liggen (voor de terugknop van PageHeader),
        // en een schuifovergang: vooruit schuift de inhoud in van rechts, terug van links. Het veld erachter blijft staan.
        (() => {
            let depth = 0;
            let nextIsBack = false; // een terugknop die één niveau hoger gaat (PageHeader Up) schuift ook terug
            const reduce = matchMedia('(prefers-reduced-motion: reduce)');
            const slide = dir => {
                const content = document.querySelector('.content');
                if (!content) return;
                content.classList.remove('nav-fwd', 'nav-back');
                void content.offsetWidth; // de animatie opnieuw laten starten
                content.classList.add(reduce.matches ? 'nav-fade' : dir === 'back' ? 'nav-back' : 'nav-fwd');
            };
            const push = history.pushState;
            history.pushState = function (...args) {
                depth++;
                const result = push.apply(this, args);
                slide(nextIsBack ? 'back' : 'fwd');
                nextIsBack = false;
                return result;
            };
            addEventListener('popstate', () => { depth = Math.max(0, depth - 1); slide('back'); });
            window.truitje.canGoBack = () => depth > 0;
            window.truitje.markBack = () => { nextIsBack = true; };
        })();
    </script>
    <script src="pitch.js"></script>
    <!-- Geen #[.{fingerprint}]: bij publish wordt index.html niet herschreven en zou de placeholder letterlijk blijven staan. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <div id="update-banner" hidden>
        Er is een nieuwe versie van Truitje Trek.
        <a href="." class="reload">Herladen</a>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            const startedAt = Date.now();
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                // Een app die op de gsm openblijft, kijkt bij terugkeren of er een nieuwe versie is.
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') reg.update().catch(() => { });
                });
            });
            // Een nieuwe service worker neemt het meteen over (skipWaiting). Net na het opstarten
            // herladen we vanzelf; midden in een spel tonen we liever een melding.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController) return;
                if (Date.now() - startedAt < 10000) location.reload();
                else document.getElementById('update-banner').hidden = false;
            });
        }
    </script>
</body>

</html>
