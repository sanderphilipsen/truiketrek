    <script>
        // Kleine hulpjes voor Blazor (JS-interop).
        window.truitje = {
            shareCaps: () => ({ share: !!navigator.share, touch: matchMedia('(pointer: coarse)').matches }),
            share: async data => {
                try { await navigator.share(data); return 'ok'; }
                catch (e) { return e && e.name === 'AbortError' ? 'cancel' : 'error'; }
            },
            copy: async text => {
                try { await navigator.clipboard.writeText(text); return true; }
                catch { return false; }
            },
            // Tijdens een vraag: wie de app verlaat (andere app, ander tabblad, scherm uit), meldt dat aan Blazor. Bij het
            // verbergen meteen; lukte dat niet meer (de gsm bevriest de pagina), dan nog eens bij het terugkeren.
            watchLeave: ref => {
                window.truitje.unwatchLeave();
                let left = false;
                const handler = () => {
                    if (document.visibilityState === 'hidden') left = true;
                    else if (!left) return;
                    ref.invokeMethodAsync('LeftScreen').catch(() => { });
                };
                document.addEventListener('visibilitychange', handler);
                window.truitje._leave = handler;
            },
            unwatchLeave: () => {
                if (window.truitje._leave) document.removeEventListener('visibilitychange', window.truitje._leave);
                window.truitje._leave = null;
            },
            // Pushmeldingen (zie PushClient). Wat dit toestel kan: 'unsupported', 'ios-install' (iPhone of iPad in de
            // browser: push werkt daar enkel vanaf het beginscherm), of de toestemming: 'default', 'granted', 'denied'.
            pushState: () => {
                const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
                const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))
                    return ios && !standalone ? 'ios-install' : 'unsupported';
                return Notification.permission;
            },
            // Abonneren met de publieke sleutel van de server. Met ask vraagt de browser toestemming (enkel na een tik).
            // Geeft { endpoint, p256dh, auth } of null als er geen toestemming is.
            pushSubscribe: async (publicKey, ask) => {
                if (Notification.permission !== 'granted'
                    && (!ask || await Notification.requestPermission() !== 'granted')) return null;
                const pad = '='.repeat((4 - publicKey.length % 4) % 4);
                const key = Uint8Array.from(atob((publicKey + pad).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                // Gemaakt met een andere sleutel: dat abonnement krijgt niets meer van deze server.
                const old = sub?.options.applicationServerKey;
                if (old && !(old.byteLength === key.length && new Uint8Array(old).every((b, i) => b === key[i]))) {
                    await sub.unsubscribe();
                    sub = null;
                }
                sub ??= await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                const json = sub.toJSON();
                return { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth };
            },
            // Het abonnement van dit toestel, om het bij het afmelden los te koppelen van de speler.
            pushEndpoint: async () => {
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
                const reg = await navigator.serviceWorker.getRegistration();
                return (await reg?.pushManager.getSubscription())?.endpoint ?? null;
            },
        };

        // Navigatie in de app: hoeveel schermen terug er nog binnen de app liggen (voor de terugknop van PageHeader),
        // en een schuifovergang: vooruit schuift de inhoud in van rechts, terug van links. Het veld erachter blijft staan.
        (() => {
            let depth = 0;
            let nextIsBack = false; // een terugknop die één niveau hoger gaat (PageHeader Up) schuift ook terug
            const reduce = matchMedia('(prefers-reduced-motion: reduce)');
            const slide = dir => {
                const content = document.querySelector('.content');
                if (!content) return;
                content.classList.remove('nav-fwd', 'nav-back');
                void content.offsetWidth; // de animatie opnieuw laten starten
                content.classList.add(reduce.matches ? 'nav-fade' : dir === 'back' ? 'nav-back' : 'nav-fwd');
            };
            const push = history.pushState;
            history.pushState = function (...args) {
                depth++;
                const result = push.apply(this, args);
                slide(nextIsBack ? 'back' : 'fwd');
                nextIsBack = false;
                return result;
            };
            // Vervangen (bv. van vraag naar vraag) telt niet als extra stap terug, maar schuift wel.
            const replace = history.replaceState;
            history.replaceState = function (...args) {
                const before = location.href;
                const result = replace.apply(this, args);
                if (location.href !== before) {
                    slide(nextIsBack ? 'back' : 'fwd');
                    nextIsBack = false;
                }
                return result;
            };
            addEventListener('popstate', () => { depth = Math.max(0, depth - 1); slide('back'); });
            window.truitje.canGoBack = () => depth > 0;
            window.truitje.markBack = () => { nextIsBack = true; };
        })();
    </script>

    <!-- Geen #[.{fingerprint}]: bij publish wordt index.html niet herschreven en zou de placeholder letterlijk blijven staan. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <div id="update-banner" hidden>
        Er is een nieuwe versie van Truitje Trek.
        <a href="." class="reload">Herladen</a>
        <a href="meldingen" class="reload">Wat is er nieuw?</a>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            const startedAt = Date.now();
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                // Een app die op de gsm openblijft, kijkt bij terugkeren of er een nieuwe versie is.
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') reg.update().catch(() => { });
                });
            });
            // Een nieuwe service worker neemt het meteen over (skipWaiting). Net na het opstarten
            // herladen we vanzelf; midden in een spel tonen we liever een melding.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController) return;
                if (Date.now() - startedAt < 10000) location.reload();
                else document.getElementById('update-banner').hidden = false;
            });
        }
    </script>
