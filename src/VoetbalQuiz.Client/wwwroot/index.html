<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Truitje Trek – Voetbalquiz</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Kleuren-emoji (o.a. vlaggen, die Windows anders als letters toont) voor de emoji-raadsels -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VoetbalQuiz.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Er ging iets mis.
        <a href="." class="reload">Herladen</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Geen #[.{fingerprint}]: bij publish wordt index.html niet herschreven en zou de placeholder letterlijk blijven staan. -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script>window.selectField = el => { el.focus(); el.select(); };</script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
